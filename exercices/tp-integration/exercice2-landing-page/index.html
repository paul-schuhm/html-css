<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Landing page (sans flexbox)</title>

        <style>
            body {
                margin: 0;
            }

            /* Placer le container en relative pour pouvoir mettre le h1 en absolute */
            header div {
                position: relative;
                height: 50vh;
            }

            header img {
                position: absolute;
                top: 0;
                left: 0;
                object-fit: cover;
                width: 100%;
                height: 100%;
            }

            header h1 {
                /* Centrage manuel */
                position: absolute;
                top: 50%;
                left: 50%;
                /* Décaler de la largeur et hauteur, car le point supérieur gauche sert de position. */
                /* centre parfaitement */
                transform: translate(-50%,-50%);
                color: white;
                font-size: 72px;
                font-weight: 700;
                letter-spacing: -1px;
                z-index: 2;
                margin: 0;
            }

            ul {
                list-style: none;
                padding: 0;
                text-align: center;

                li {
                    display: inline-block;
                    margin-right: 30px;
                }
            }

            /* Pseudo élément pour créer l'overlay */
            header div::after {
                content: "";
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(192, 29, 29, 0.5);
            }
        </style>
    </head>

    <body>

        <header>
            <nav>
                <ul>
                    <li><a href="">Accueil</a></li>
                    <li><a href="">Blog</a></li>
                    <li><a href="">A propos</a></li>
                </ul>
            </nav>
            <div>
                <img src="./banner.jpg" alt="">
                <h1>Website title</h1>
            </div>
        </header>

        <h2>Our website</h2>

        <h2>Objectifs</h2>

        <p>
            Créer une <em>landing page</em> avec une section image et un titre superposé centré, sans utiliser <code>flexbox</code>. <a href="https://github.com/paul-schuhm/html-css/blob/main/demos/css-flexbox/landing-page-avec-flexbox.html">Comparer avec le code à fournir <em>avec flexbox</em></a> !
        </p>

    </body>

</html>
