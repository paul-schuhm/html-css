<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>

        <style>
            body {
                margin: 0;
            }

            header div {
                position: relative;
                height: 50vh;
            }

            header img {
                position: absolute;
                top: 0;
                left: 0;
                object-fit: cover;
                width: 100%;
                height: 100%;
            }

            header h1 {
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%,-50%);
                /* centre parfaitement */
                color: white;
                font-size: 72px;
                font-weight: 700;
                letter-spacing: -1px;
                z-index: 2;
                margin: 0;
            }

            ul {
                list-style: none;
                padding: 0;
                text-align: center;

                li {
                    display: inline-block;
                    margin-right: 30px;
                }
            }

            /* Pseudo élément */
            header div::after {
                content: "";
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(192, 29, 29, 0.5);
            }
        </style>
    </head>

    <body>

        <header>
            <nav>
                <ul>
                    <li><a href="">Accueil</a></li>
                    <li><a href="">Blog</a></li>
                    <li><a href="">A propos</a></li>
                </ul>
            </nav>
            <div>
                <img src="./banner.jpg" alt="">
                <h1>Website title</h1>
            </div>
        </header>

        <h2>Our website</h2>


    </body>

</html>
