<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>




    <style>

        :root{
            --secondary-color: rgb(179, 177, 177);
            --breakpoint-large: 992px;
        }


        body {
            display: flex;
            gap: 50px;
        }

        .container {
            display: grid;
            grid-template-columns: 200px 200px 200px;
            grid-auto-rows: 200px;
            gap: 2px;
        }

        article {
            background: var(--secondary-color);
            padding: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px dashed black;
            flex-direction: column;

            &:nth-child(even) {
                background: white;
            }


        }

        aside {
            background-color: var(--secondary-color);
            width: 10%;
            padding: 12px;
            font-size: 12px;
        }

        @media screen and (max-width: 992px) {

            .container {
                display: grid;
                grid-template-columns: 1fr;
                gap: 2px;
            }
            article{
                display: block;
            }

            aside{
                display: none;
            }

            .w-100{
                width: 100%;
            } 
        }
    </style>


</head>

<body>
    <aside>
        <h2>Actualités</h2>
        <p>Lorem ipsum...</p>
    </aside>
    <div class="w-100">
        <header>
            <h1>Articles</h1>
        </header>
        <div class="container">
            <article>
                <h2>Article 1</h2>

            </article>

                <a href="">Lire</a>
            </article>
            <article>
                <h2>Article 4</h2>
                <a href="">Lire</a>

            </article>
            <article>
                <h2>Article 5</h2>
                <a href="">Lire</a>
            </article>
            <article>
                <h2>Article 6</h2>
                <a href="">Lire</a>
            </article>
            <article>
                <h2>Article 7</h2>
                <a href="">Lire</a>
            </article>
        </div>
    </div>
</body>

</html>
